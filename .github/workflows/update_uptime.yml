name: Update Uptime

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨0点运行
  workflow_dispatch: # 允许手动点击运行

jobs:
  update-uptime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Python script
        run: |
          python - << 'EOF'
          import re
          from datetime import datetime

          # 你的开始时间
          start_date = datetime(2024, 9, 15)
          now = datetime.now()
          
          # 计算年月日
          years = now.year - start_date.year
          months = now.month - start_date.month
          days = now.day - start_date.day
          
          if days < 0:
              months -= 1
              days += 30
          if months < 0:
              years -= 1
              months += 12
              
          uptime_text = f"{years} years, {months} months, {days} days"

          # 读取 README.md
          with open('README.md', 'r', encoding='utf-8') as file:
              content = file.read()
          
          # 核心修改：使用正则表达式，只替换 START 和 END 注释之间的内容，保留占位符本身
          # r'\1' 和 r'\3' 保留前后的注释，\2 是中间被替换掉的旧文本
          new_content, count = re.subn(
              r'(<!-- UPTIME_START -->).*?(<!-- UPTIME_END -->)', 
              lambda m: m.group(1) + uptime_text + m.group(2), 
              content, 
              flags=re.DOTALL
          )
          
          if count == 0:
              print("警告：未找到 UPTIME_START 占位符，请检查 README.md 是否写对了！")
          
          # 写回 README.md
          with open('README.md', 'w', encoding='utf-8') as file:
              file.write(new_content)
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update uptime: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
